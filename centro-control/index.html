<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Centro de Control · Revisado</title>
<style>
:root{color-scheme:dark;--bg:#0b0d12;--s1:#141821;--s2:#1c2230;--bd:#262d3d;--tx:#eef1f7;--mu:#8a93a8;--ac:#7c9cff;--ok:#3ddc97;--bad:#ff6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:12px 14px calc(110px + env(safe-area-inset-bottom,0px))}
h1{font-size:24px;margin:4px 0 2px}
h2{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.07em;margin:20px 2px 8px;font-weight:600}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}
.mu{color:var(--mu);font-size:13px}.li{padding:10px 0}.li+.li{border-top:1px solid var(--bd)}
.chip{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap;margin-right:4px}
.bar{height:8px;background:var(--s2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--mu);flex:none;background:none;color:#04210f;font-size:14px;padding:0;font-weight:700}
.chk.on{background:var(--ok);border-color:var(--ok)}
.done{text-decoration:line-through;color:var(--mu)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--ac);color:#0b0d12;border:0;border-radius:12px;padding:10px 14px;font-weight:600}
.btn.g{background:var(--s2);color:var(--tx);border:1px solid var(--bd)}
.btn.r{background:none;color:var(--bad);border:1px solid var(--bad)}
.btn.s{padding:6px 10px;font-size:13px}
.seg{display:flex;background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:3px;gap:3px;margin:10px 0}
.seg button{flex:1;border:0;background:none;padding:8px 2px;border-radius:9px;color:var(--mu);font-size:13px}
.seg button.on{background:var(--s2);color:var(--tx)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(20,24,33,.96);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(12px);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mu);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 0}
nav button b{font-size:19px;font-weight:400}nav button.on{color:var(--ac)}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:6;border-radius:99px;padding:12px 20px;font-size:17px;box-shadow:0 6px 20px #0009}
#sheet{display:none;position:fixed;inset:0;background:#000a;z-index:20;align-items:flex-end;justify-content:center}
.pan{background:var(--s1);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
label{display:block;margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:11px;color:var(--tx);font:inherit;font-size:16px}
.cols{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:8px}
.cols div{flex:1;text-align:center;font-size:10px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.cols i{display:block;border-radius:6px 6px 0 0;min-height:2px;margin:2px auto 3px;width:70%}
.big{font-size:22px;font-weight:700}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.warn{border-color:#a9852c;background:#2a2412}
</style></head><body><div id="app"></div><div id="sheet"></div>
<script>
const K='cce_v1',B={ropa:{n:'Ropa',c:'#ff9f5a',e:'👕'},tenis:{n:'Tenis IA',c:'#4cc9f0',e:'🎾'},promo:{n:'PromoKit',c:'#b388ff',e:'✨'}},bk=Object.keys(B);
const blank=()=>({tasks:[],tx:[],goals:[],items:[],preds:[],leads:[],bk:0,tennisSync:{items:[],sourceCheckedAt:'',syncedAt:'',snapshotDigest:'',totalRegistered:0,truncated:false,strictTemporalValidated:0}});
let D=blank(),U={tab:'home',biz:'ropa',wo:0,fv:'fin',fm:'mes',gt:'sem',m:null,cfg:0,ok:true,promoSession:null,promoData:null,promoMessage:''};
try{const r=localStorage.getItem(K);if(r)D=Object.assign(blank(),JSON.parse(r))}catch(e){U.ok=false}
if(!D.tennisSync||!Array.isArray(D.tennisSync.items))D.tennisSync=blank().tennisSync;
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),p2=n=>String(n).padStart(2,'0');
const fd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()),today=()=>fd(new Date());
const DN=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],fs=s=>{const d=new Date(s+'T00:00:00');return DN[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $$=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n*100)/100).toLocaleString('es-AR');
const num=s=>{const n=parseFloat(String(s).replace(',','.'));return isNaN(n)?0:n};
const g=(c,id)=>D[c].find(x=>x.id===id),sum=(l,ty)=>l.filter(x=>x.ty===ty).reduce((s,x)=>s+x.a,0);
const chip=b=>`<span class="chip" style="color:${B[b].c}">${B[b].e} ${B[b].n}</span>`;
const bz=()=>bk.map(k=>[k,B[k].n]);
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){U.ok=false}render()}
const pct=b=>{const t=D.tasks.filter(x=>x.b===b);return t.length?Math.round(t.filter(x=>x.d).length/t.length*100):null};
const fin0=(b,mk)=>{const l=D.tx.filter(x=>(!b||x.b===b)&&(!mk||x.dt.slice(0,7)===mk)),i=sum(l,'in'),o=sum(l,'out');return{i,o,n:i-o,l}};
const bar=(p,c)=>`<div class="bar"><i style="width:${p||0}%;background:${c}"></i></div>`;
/* ---------- formularios ---------- */
function form(title,fs_,ok,del){U.m={title,fs:fs_,ok,del};U.cfg=0;drawSheet()}
function drawSheet(){const s=$('#sheet'),m=U.m;
 if(U.cfg){s.style.display='flex';const j=JSON.stringify(D);s.innerHTML=`<div class="pan"><h1 style="font-size:19px">Datos y respaldo</h1><p class="mu">Tus datos se guardan en este navegador (${U.ok?'almacenamiento activo':'⚠ almacenamiento NO disponible'}). Si borrás datos del sitio o dejás de usarlo por varios días en Safari, pueden perderse. Copiá el respaldo y guardalo en Notas, WhatsApp (chat contigo) o email.</p><label>Respaldo actual</label><textarea id="exp" rows="3" readonly>${esc(j)}</textarea><button class="btn" style="margin-top:8px;width:100%" data-a="cp">Copiar respaldo</button><label>Restaurar (pegá un respaldo)</label><textarea id="imp" rows="3"></textarea><button class="btn g" style="margin-top:8px;width:100%" data-a="rs">Restaurar datos</button><button class="btn r" style="margin-top:14px;width:100%" data-a="wipe" id="wp">Borrar todo</button><button class="btn g" style="margin-top:10px;width:100%" data-a="mx">Cerrar</button></div>`;return}
 if(!m){s.style.display='none';s.innerHTML='';return}
 s.style.display='flex';
 s.innerHTML=`<div class="pan"><h1 style="font-size:19px">${esc(m.title)}</h1>${m.fs.map(f=>`<label class="mu">${esc(f.l)}</label>`+(f.t==='select'?`<select name="${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}" ${o[0]==f.v?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:`<input name="${f.k}" type="${f.t||'text'}" ${f.t==='number'?'inputmode="decimal"':''} value="${esc(f.v??'')}">`)).join('')}<div class="row" style="margin-top:16px"><button class="btn g sp" data-a="mx">Cancelar</button>${m.del?'<button class="btn r" data-a="md">Eliminar</button>':''}<button class="btn sp" data-a="ms">Guardar</button></div></div>`}
const vals=()=>{const v={};document.querySelectorAll('#sheet [name]').forEach(e=>v[e.name]=e.value);return v};
/* ---------- altas y ediciones ---------- */
const tf=(x)=>[{k:'t',l:'Tarea',v:x.t},{k:'b',l:'Negocio',t:'select',o:bz(),v:x.b},{k:'dt',l:'Fecha (opcional)',t:'date',v:x.dt}];
function addTask(dt='',b=U.biz){if(U.tab!=='biz')b='ropa';form('Nueva tarea',tf({t:'',b,dt}),v=>{if(!v.t.trim())return false;D.tasks.push({id:uid(),b:v.b,t:v.t.trim(),d:false,dt:v.dt})})}
function editTask(x){form('Editar tarea',tf(x),v=>{if(!v.t.trim())return false;Object.assign(x,{t:v.t.trim(),b:v.b,dt:v.dt})},()=>{D.tasks=D.tasks.filter(y=>y!==x)})}
const txf=(x)=>[{k:'a',l:'Monto',t:'number',v:x.a||''},{k:'t',l:'Descripción',v:x.t},{k:'b',l:'Negocio',t:'select',o:bz(),v:x.b},{k:'dt',l:'Fecha',t:'date',v:x.dt}];
function addTx(ty,b=U.tab==='biz'?U.biz:'ropa'){form(ty==='in'?'Nuevo ingreso':'Nuevo gasto',txf({a:'',t:'',b,dt:today()}),v=>{if(num(v.a)<=0||!v.dt)return false;D.tx.push({id:uid(),ty,b:v.b,a:num(v.a),t:v.t.trim(),dt:v.dt})})}
function editTx(x){form(x.ty==='in'?'Editar ingreso':'Editar gasto',txf(x),v=>{if(num(v.a)<=0||!v.dt)return false;Object.assign(x,{a:num(v.a),t:v.t.trim(),b:v.b,dt:v.dt})},()=>{D.tx=D.tx.filter(y=>y!==x)})}
const TERM={sem:'Semana',mes:'Mes',largo:'Largo plazo'};
const gf=x=>[{k:'t',l:'Meta',v:x.t},{k:'b',l:'Negocio',t:'select',o:bz(),v:x.b},{k:'term',l:'Plazo',t:'select',o:Object.entries(TERM),v:x.term}];
function addGoal(){form('Nueva meta',gf({t:'',b:U.tab==='biz'?U.biz:'ropa',term:U.gt}),v=>{if(!v.t.trim())return false;D.goals.push({id:uid(),b:v.b,term:v.term,t:v.t.trim(),d:false})})}
function editGoal(x){form('Editar meta',gf(x),v=>{if(!v.t.trim())return false;Object.assign(x,{t:v.t.trim(),b:v.b,term:v.term})},()=>{D.goals=D.goals.filter(y=>y!==x)})}
const CH=['Facebook Marketplace','WhatsApp Business','Mercado Libre'],CO=['Nuevo','Usado'];
const itf=x=>[{k:'n',l:'Producto',v:x.n},{k:'c',l:'Estado',t:'select',o:CO.map(o=>[o,o]),v:x.c},{k:'cost',l:'Costo unitario',t:'number',v:x.cost||''},{k:'price',l:'Precio de venta',t:'number',v:x.price||''},{k:'stock',l:'Stock',t:'number',v:x.stock??1}];
const itSet=(x,v)=>Object.assign(x,{n:v.n.trim(),c:v.c,cost:num(v.cost),price:num(v.price),stock:Math.max(0,Math.floor(num(v.stock)))});
function addItem(){form('Nuevo producto',itf({n:'',c:'Nuevo'}),v=>{if(!v.n.trim())return false;const x={id:uid()};itSet(x,v);D.items.push(x)})}
function editItem(x){form('Editar producto',itf(x),v=>{if(!v.n.trim())return false;itSet(x,v)},()=>{D.items=D.items.filter(y=>y!==x)})}
function sell(x){form('Vender: '+x.n,[{k:'p',l:'Precio de venta',t:'number',v:x.price},{k:'ch',l:'Canal',t:'select',o:CH.map(o=>[o,o]),v:CH[0]},{k:'fee',l:'Comisión / envío pagado (opcional)',t:'number',v:''}],v=>{if(num(v.p)<=0||x.stock<1)return false;D.tx.push({id:uid(),ty:'in',b:'ropa',a:num(v.p),t:'Venta: '+x.n+' ('+v.ch+')',dt:today(),ch:v.ch});if(num(v.fee)>0)D.tx.push({id:uid(),ty:'out',b:'ropa',a:num(v.fee),t:'Comisión/envío: '+x.n,dt:today()});x.stock--})}
const prf=x=>[{k:'m',l:'Partido (Jugador A vs Jugador B)',v:x.m},{k:'pk',l:'Mi predicción (ganador)',v:x.pk},{k:'c',l:'Circuito',t:'select',o:[['ATP','ATP'],['Challenger','Challenger']],v:x.c},{k:'dt',l:'Fecha',t:'date',v:x.dt}];
function addPred(){form('Nuevo partido',prf({m:'',pk:'',c:'ATP',dt:today()}),v=>{if(!v.m.trim()||!v.pk.trim())return false;D.preds.push({id:uid(),m:v.m.trim(),pk:v.pk.trim(),c:v.c,dt:v.dt,res:'',createdAt:new Date().toISOString()})})}
function editPred(x){if(x.res||x.settledAt){window.alert('Este pronóstico ya fue evaluado y no se puede modificar. Podés corregir el resultado, pero la predicción original queda protegida.');return}form('Editar partido',prf(x),v=>{if(!v.m.trim()||!v.pk.trim())return false;Object.assign(x,{m:v.m.trim(),pk:v.pk.trim(),c:v.c,dt:v.dt})},()=>{D.preds=D.preds.filter(y=>y!==x)})}
const ST=['Contactado','En prueba','Cliente','Descartado'];
const lf=x=>[{k:'n',l:'Nombre / usuario',v:x.n},{k:'s',l:'Estado',t:'select',o:ST.map(o=>[o,o]),v:x.s},{k:'nt',l:'Nota',v:x.nt}];
function addLead(){form('Nuevo contacto',lf({n:'',s:ST[0],nt:''}),v=>{if(!v.n.trim())return false;D.leads.push({id:uid(),n:v.n.trim(),s:v.s,nt:v.nt})})}
function editLead(x){form('Editar contacto',lf(x),v=>{if(!v.n.trim())return false;Object.assign(x,{n:v.n.trim(),s:v.s,nt:v.nt})},()=>{D.leads=D.leads.filter(y=>y!==x)})}
const SEED=[['ropa','Fotografiar y listar los primeros 10 productos'],['ropa','Definir el precio de cada producto (costo + margen)'],['ropa','Publicar en Facebook Marketplace'],['ropa','Armar el catálogo de WhatsApp Business'],['ropa','Publicar en Mercado Libre'],['ropa','Avisar a mis contactos que ya vendo'],['tenis','Registrar mi predicción de cada partido antes de que empiece'],['tenis','Cargar el resultado de los partidos terminados'],['tenis','Definir muestra mínima y métrica de validación'],['tenis','Revisar los errores y anotar mejoras técnicas'],['promo','Definir cliente ideal y propuesta de valor'],['promo','Probar el generador con 5 casos reales (ES e EN)'],['promo','Publicar 3 contenidos mostrando el producto'],['promo','Contactar a 10 creadores para una prueba gratuita']];
/* ---------- acciones ---------- */
const A={
tab:d=>{U.tab=d.v;scrollTo(0,0);render()},gob:d=>{U.tab='biz';U.biz=d.v;scrollTo(0,0);render()},
set:d=>{U[d.k]=d.v;render()},wk:d=>{U.wo=d.v==='0'?0:U.wo+ +d.v;render()},
tog:d=>{const x=g(d.c||'tasks',d.id);x.d=!x.d;save()},tod:d=>{g('tasks',d.id).dt=today();save()},
edT:d=>editTask(g('tasks',d.id)),edX:d=>editTx(g('tx',d.id)),edG:d=>editGoal(g('goals',d.id)),edI:d=>editItem(g('items',d.id)),edP:d=>editPred(g('preds',d.id)),edL:d=>editLead(g('leads',d.id)),
sell:d=>sell(g('items',d.id)),res:d=>{const x=g('preds',d.id);if(d.v&&!x.settledAt)x.settledAt=new Date().toISOString();x.res=d.v;save()},
addT:d=>addTask(d.dt||''),addX:d=>addTx(d.v),addG:()=>addGoal(),addI:()=>addItem(),addP:()=>addPred(),addL:()=>addLead(),
fab:()=>U.tab==='fin'?addTx('in'):U.tab==='goals'?addGoal():addTask(),
seed:()=>{SEED.forEach(s=>D.tasks.push({id:uid(),b:s[0],t:s[1],d:false,dt:''}));save()},
mx:()=>{U.m=null;U.cfg=0;drawSheet()},ms:()=>{if(U.m.ok(vals())===false)return;U.m=null;drawSheet();save()},md:()=>{U.m.del();U.m=null;drawSheet();save()},
cfg:()=>{U.m=null;U.cfg=1;drawSheet()},
cp:async()=>{const t=$('#exp'),b=$('[data-a="cp"]');let copied=false;try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(t.value);copied=true}}catch(e){}if(!copied){try{t.focus();t.select();copied=document.execCommand('copy')}catch(e){}}if(copied){D.bk=Date.now();try{localStorage.setItem(K,JSON.stringify(D))}catch(e){U.ok=false}b.textContent='Copiado ✓'}else{b.textContent='No se copió: seleccioná el texto y copialo manualmente'}},
rs:()=>{try{const o=JSON.parse($('#imp').value);if(!o||!['tasks','tx','goals','items','preds','leads'].every(k=>Array.isArray(o[k])))throw 0;D=Object.assign(blank(),o);U.promoSession=null;U.promoData=null;if(!D.tennisSync||!Array.isArray(D.tennisSync.items))D.tennisSync=blank().tennisSync;U.cfg=0;drawSheet();save()}catch(e){$('[data-a="rs"]').textContent='Respaldo inválido'}},
wipe:()=>{const b=$('#wp');if(b.dataset.s){D=blank();U.cfg=0;drawSheet();save()}else{b.dataset.s=1;b.textContent='Tocá otra vez para confirmar'}}};
document.addEventListener('click',e=>{if(e.target.id==='sheet'){A.mx();return}const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a])A[el.dataset.a](el.dataset)});
/* ---------- vistas ---------- */
const taskRow=(x,ex='')=>`<div class="li row"><button class="chk ${x.d?'on':''}" data-a="tog" data-id="${x.id}">${x.d?'✓':''}</button><div class="sp" data-a="edT" data-id="${x.id}"><div class="${x.d?'done':''}">${esc(x.t)}</div><div class="mu">${chip(x.b)}${x.dt?fs(x.dt):''}</div></div>${ex}</div>`;
const sec=(h,l)=>l.length?`<h2>${h}</h2><div class="card">${l.map(x=>taskRow(x,x.d?'':`<button class="btn g s" data-a="tod" data-id="${x.id}">Hoy</button>`)).join('')}</div>`:'';
const empty=()=>`<div class="card"><b>Todavía no hay tareas</b><p class="mu">Podés crearlas con el botón +, o cargar una lista inicial sugerida (sin completar, 0% de avance) y editarla a tu gusto.</p><button class="btn" data-a="seed">Cargar tareas iniciales</button></div>`;
const seg=(k,o)=>`<div class="seg">${o.map(x=>`<button class="${U[k]===x[0]?'on':''}" data-a="set" data-k="${k}" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>`;
function rec(){const t=today();return bk.map(b=>{const ts=D.tasks.filter(x=>x.b===b&&!x.d),due=ts.filter(x=>x.dt&&x.dt<=t).length,inc=sum(D.tx.filter(x=>x.b===b),'in');let p=due*2+Math.min(ts.length,5),r=[];
 if(due)r.push(due+' tarea(s) vencidas o para hoy');
 if(!inc){p+=3;r.push('todavía sin ingresos registrados')}
 if(b==='ropa'){p+=1;r.push('es el camino más corto a la primera venta');if(!D.items.length)r.push('aún sin productos cargados')}
 if(b==='tenis'){const n=D.preds.filter(x=>x.res).length;if(n<100){p+=2;r.push('solo '+n+' partidos evaluados (referencia sugerida: 100+)')}}
 if(b==='promo'&&!D.leads.length){p+=1;r.push('sin contactos registrados')}
 return{b,p,r}}).sort((a,c)=>c.p-a.p)}
function home(){const t=today(),td=D.tasks.filter(x=>x.dt===t),dn=td.filter(x=>x.d).length,od=D.tasks.filter(x=>!x.d&&x.dt&&x.dt<t).length,has=D.tasks.length+D.tx.length+D.items.length+D.preds.length;
 const R=rec(),old=has&&Date.now()-D.bk>6048e5;
 return `<div class="row"><div class="sp"><h1>Centro de Control</h1><div class="mu">${fs(t)}</div></div><button class="btn g s" data-a="cfg">⚙ Datos</button></div>
${!U.ok?'<div class="card warn mu">⚠ Este navegador no permite guardar datos. Usá el respaldo manual (⚙ Datos).</div>':old?'<div class="card warn mu">Hace más de 7 días que no hacés respaldo. Tocá ⚙ Datos para copiarlo.</div>':''}

function parseSportAiExport(obj){
 if(!obj||obj.status!=='available'||!Array.isArray(obj.items)||typeof obj.totalRegistered!=='number')throw Error('No parece ser una exportación oficial disponible de /api/evaluation.');
 if(obj.items.length>1000||obj.totalRegistered<obj.items.length)throw Error('El informe tiene una estructura inesperada.');
 const seen=new Set(), rows=[];
 for(const entry of obj.items){
  if(!entry||typeof entry!=='object'||!entry.forecast||!entry.review)throw Error('Faltan datos de un pronóstico.');
  const f=entry.forecast,r=entry.review,input=f.input||{};
  if(typeof f.id!=='string'||!f.id||seen.has(f.id))throw Error('ID repetido o inválido en la exportación.');
  seen.add(f.id);
  const a=typeof input.a==='string'?input.a:(input.a?.name||input.a?.label||'Jugador A');
  const b=typeof input.b==='string'?input.b:(input.b?.name||input.b?.label||'Jugador B');
  const probability=typeof f.prediction?.p==='number'&&f.prediction.p>=0&&f.prediction.p<=1?f.prediction.p:null;
  const reviewed=r.status==='linked_exploratory'&&typeof r.baseline?.winnerAccuracy==='number';
  rows.push({id:f.id,match:String(a)+' vs '+String(b),date:String(input.date||'').slice(0,16),circuit:String(input.circuit||''),
   pick:probability===null?'Probabilidad no disponible':probability===.5?'Pronóstico 50/50':String(probability>.5?a:b),
   probability,status:String(r.status||'pending'),accuracy:reviewed?r.baseline.winnerAccuracy:null,
   createdAt:String(f.created||''),modelVersion:String(f.prediction?.sportsCalibration?.version||'')});
 }
 return {items:rows,sourceCheckedAt:String(obj.checkedAt||''),syncedAt:new Date().toISOString(),
  snapshotDigest:String(obj.snapshotDigest||''),totalRegistered:obj.totalRegistered,
  truncated:!!obj.truncated,strictTemporalValidated:Number(obj.summary?.strictTemporalValidated||0)};
}

async function authPromo(email,password){
 const res=await fetch(PROMO_SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:PROMO_PUBLIC_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password}),cache:'no-store'});
 const body=await res.json().catch(()=>({}));if(!res.ok||!body.access_token||!body.user?.id)throw Error(body.msg||body.error_description||body.message||'No se pudo iniciar sesión.');
 return {access:body.access_token,refresh:body.refresh_token,userId:body.user.id,email:body.user.email||email,expiresAt:Date.now()+Math.max(0,Number(body.expires_in||3600))*1000};
}
async function ensurePromoToken(){
 const s=U.promoSession;if(!s)throw Error('Iniciá sesión para sincronizar.');
 if(Date.now()<s.expiresAt-60000)return s;
 const res=await fetch(PROMO_SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:PROMO_PUBLIC_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh}),cache:'no-store'});
 const data=await res.json().catch(()=>({}));if(!res.ok||!data.access_token||data.user?.id!==s.userId)throw Error('Sesión vencida. Desconectá e iniciá sesión otra vez.');
 s.access=data.access_token;s.refresh=data.refresh_token||s.refresh;s.expiresAt=Date.now()+Number(data.expires_in||3600)*1000;return s;
}
async function fetchPromoHistory(){
 const s=await ensurePromoToken();
 const fetchRows=async(extra={},limit=200)=>{
  const url=new URL(PROMO_SB+'/rest/v1/generation_history');
  Object.entries({select:'id,topic,platform,language,created_at',user_id:'eq.'+s.userId,order:'created_at.desc',limit:String(limit),...extra}).forEach(([k,v])=>url.searchParams.set(k,v));
  const res=await fetch(url.toString(),{headers:{apikey:PROMO_PUBLIC_KEY,Authorization:'Bearer '+s.access,Prefer:'count=exact'},cache:'no-store'});
  if(!res.ok)throw Error('No se pudo leer el historial ('+res.status+'). Revisá la sesión y los permisos de tu cuenta.');
  const rows=await res.json();if(!Array.isArray(rows))throw Error('Respuesta inesperada del historial.');
  const range=res.headers.get('content-range')||'';const match=range.match(/\/(\d+)$/);
  return {rows,count:match?Number(match[1]):rows.length,estimated:!match};
 };
 const now=new Date(),start=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),1)).toISOString();
 const end=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth()+1,1)).toISOString();
 const [all,monthly]=await Promise.all([fetchRows(),fetchRows({and:'(created_at.gte.'+start+',created_at.lt.'+end+')'},1)]);
 // Intervalo [inicio de mes UTC, inicio del próximo mes UTC).
 if(U.promoSession!==s)throw Error('La sesión cambió mientras se consultaba.');
 return {items:all.rows.map(x=>({id:String(x.id||''),topic:String(x.topic||''),platform:String(x.platform||''),language:String(x.language||''),created_at:String(x.created_at||'')})),
  total:all.count,monthTotal:monthly.count,syncedAt:new Date().toISOString(),estimated:all.estimated||monthly.estimated};
}
async function importSportFile(file){
 if(!file)return;
 const msg=$('#tennisMsg');if(msg)msg.textContent='Validando el archivo…';
 try{
  if(file.size>5*1024*1024)throw Error('El archivo supera el límite de 5 MB.');
  const t=await file.text(),parsed=parseSportAiExport(JSON.parse(t));
  D.tennisSync=parsed;save();
 }catch(e){const m=$('#tennisMsg');if(m)m.textContent='⚠ '+String(e.message||e)}
}
// Eventos delegados para el selector de archivos: Safari iPhone / Archivos.
document.addEventListener('change',e=>{if(e.target.id==='tennisFile')importSportFile(e.target.files?.[0])});
A.promoLogin=async()=>{
 const email=($('#promoEmail')?.value||'').trim(),pass=$('#promoPassword')?.value||'';
 const b=$('#promoLogin');if(!email||!pass){U.promoMessage='Ingresá correo y contraseña.';render();return}
 if(b)b.disabled=true;
 try{const s=await authPromo(email,pass);U.promoSession=s;U.promoData=null;U.promoMessage='Sesión iniciada. Consultando historial…';render();U.promoData=await fetchPromoHistory();U.promoMessage='Historial sincronizado (solo lectura).'}
 catch(e){U.promoMessage='⚠ '+String(e.message||e);if(!U.promoSession)U.promoData=null}
 finally{render()}
};
A.promoRefresh=async()=>{U.promoMessage='Consultando Supabase…';render();try{U.promoData=await fetchPromoHistory();U.promoMessage='Generaciones actualizadas.'}catch(e){U.promoMessage='⚠ '+String(e.message||e)}render()};
A.promoLogout=()=>{U.promoSession=null;U.promoData=null;U.promoMessage='Panel desconectado. No se guardaron credenciales.';render()};
